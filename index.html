<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyDash - Reading Tracker</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 40px;
      background-color: #f4f6f8;
      color: #333;
    }
    h1 { color: #2c3e50; }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .card h3 { margin-top: 0; margin-bottom: 10px; }
    .progress-bar {
      background: #e0e0e0;
      border-radius: 6px;
      height: 12px;
      width: 100%;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-fill {
      background: #27ae60;
      height: 100%;
      width: 0%;
      transition: width 0.4s ease-in-out;
    }
  </style>
  <!-- Libreria per la scansione del codice a barre tramite webcam -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

  <h1>📚 MyDash - Reading Tracker</h1>

  <!-- Box Fotocamera / Webcam per scansione ISBN -->
  <div class="card" style="max-width: 400px; margin-bottom: 25px;">
    <h3>📷 Scansiona ISBN Libro</h3>
    <div id="reader"></div>
    <p id="stato-scansione" style="margin-top: 10px; font-weight: bold;"></p>
  </div>

  <!-- Contenitore lista libri salvati -->
  <div id="lista-libri">Caricamento libri in corso...</div>

  <script>
    const API_URL = "/api/libri";
    let isScanning = false; // Controllo per evitare invii multipli continui

    // 1. Funzione per chiedere la lista dei libri al server Python e creare l'HTML
    async function caricaLibri() {
      try {
        const risposta = await fetch(API_URL);
        const libri = await risposta.json();
        
        const contenitore = document.getElementById("lista-libri");
        contenitore.innerHTML = ""; // Puliamo il testo di caricamento

        if (libri.length === 0) {
          contenitore.innerHTML = "<p>Nessun libro presente.</p>";
          return;
        }

        libri.forEach(libro => {
          const percentuale = Math.round((libro.pagine_lette / libro.pagine_tot) * 100) || 0;
          
          const cardHTML = `
            <div class="card">
              <h3>${libro.titolo} <small style="color: #7f8c8d; font-weight: normal;">di ${libro.autore}</small></h3>
              <p>Stato: <strong>${libro.stato}</strong> | Pagine: ${libro.pagine_lette} / ${libro.pagine_tot} (${percentuale}%)</p>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${percentuale}%;"></div>
              </div>
            </div>
          `;
          
          contenitore.innerHTML += cardHTML;
        });

      } catch (errore) {
        console.error("Errore nel collegamento al server:", errore);
        document.getElementById("lista-libri").innerText = "Errore durante il collegamento al server Python. Assicurati che Uvicorn sia attivo.";
      }
    }

    // 2. Funzione per inviare l'ISBN scansionato al server Python
    async function inviaISBN(isbn) {
      // Blocca ulteriori chiamate se c'è già una richiesta in corso
      if (isScanning) return;
      isScanning = true;

      const messaggio = document.getElementById("stato-scansione");
      messaggio.style.color = "#333";
      messaggio.innerText = `ISBN: ${isbn} - Ricerca informazioni...`;

      try {
        const risposta = await fetch("/api/libri/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ isbn: isbn })
        });

        const risultato = await risposta.json();

        if (risposta.ok) {
          messaggio.style.color = "#27ae60";
          messaggio.innerText = `Aggiunto: "${risultato.libro.titolo}"!`;
          caricaLibri(); // Ricarica la lista libri aggiornata
        } else {
          messaggio.style.color = "#e74c3c";
          messaggio.innerText = risultato.detail || "Libro non trovato o già presente.";
        }
      } catch (errore) {
        console.error("Errore:", errore);
        messaggio.style.color = "#e74c3c";
        messaggio.innerText = "Errore di connessione al server.";
      } finally {
        // Pausa di 3 secondi prima di consentire una nuova scansione
        setTimeout(() => {
          isScanning = false;
        }, 3000);
      }
    }

    // 3. Attivazione dello scanner webcam
    function avviaScanner() {
      const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { fps: 10, qrbox: { width: 250, height: 150 } }, 
        false
      );

      html5QrcodeScanner.render((decodedText) => {
        inviaISBN(decodedText);
      });
    }

    // Avvio all'apertura della pagina
    caricaLibri();
    avviaScanner();
  </script>
</body>
</html>
