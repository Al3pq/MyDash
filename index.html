<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyDash - Reading Tracker</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 40px;
      background-color: #f4f6f8;
      color: #333;
    }
    h1 { color: #2c3e50; }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .card h3 { margin-top: 0; margin-bottom: 10px; }
    .progress-bar {
      background: #e0e0e0;
      border-radius: 6px;
      height: 12px;
      width: 100%;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-fill {
      background: #27ae60;
      height: 100%;
      width: 0%;
      transition: width 0.4s ease-in-out;
    }
  </style>
</head>
<body>

  <h1>📚 MyDash - Reading Tracker</h1>
  <div id="lista-libri">Caricamento libri in corso...</div>

  <script>
    // 1. Indirizzo dell'API Python su Uvicorn
    // CORRETTO (URL Relativo):
    const API_URL = "/api/libri";;

    // 2. Funzione per chiedere i dati al server Python e creare l'HTML
    async function caricaLibri() {
      try {
        // Inviamo la richiesta GET al server Python
        const risposta = await fetch(API_URL);
        
        // Trasformiamo la risposta JSON ricevuta in un oggetto JavaScript
        const libri = await risposta.json();
        
        const contenitore = document.getElementById("lista-libri");
        contenitore.innerHTML = ""; // Puliamo il testo di caricamento

        // Se non ci sono libri nel JSON
        if (libri.length === 0) {
          contenitore.innerHTML = "<p>Nessun libro presente.</p>";
          return;
        }

        // Per ogni libro presente nel JSON, creiamo una "card" grafica
        libri.forEach(libro => {
          const percentuale = Math.round((libro.pagine_lette / libro.pagine_tot) * 100);
          
          const cardHTML = `
            <div class="card">
              <h3>${libro.titolo} <small style="color: #7f8c8d; font-weight: normal;">di ${libro.autore}</small></h3>
              <p>Stato: <strong>${libro.stato}</strong> | Pagine: ${libro.pagine_lette} / ${libro.pagine_tot} (${percentuale}%)</p>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${percentuale}%;"></div>
              </div>
            </div>
          `;
          
          contenitore.innerHTML += cardHTML;
        });

      } catch (errore) {
        console.error("Errore nel collegamento al server:", errore);
        document.getElementById("lista-libri").innerText = "Errore durante il collegamento al server Python. Assicurati che Uvicorn sia attivo su localhost:8000.";
      }
    }

    // Eseguiamo la funzione appena la pagina si carica
    caricaLibri();
  </script>
</body>
</html>
